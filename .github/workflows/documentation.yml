name: Dokumentation und Wiki
on:
  push:
    branches: [main]
    paths: ['docs/**', 'build/create-*.py', 'build/sync-wiki.ps1', '.github/workflows/documentation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-main
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: PDF und Wiki-Seiten erzeugen
        shell: pwsh
        run: |
          python -m pip install reportlab==5.1.0
          if ($LASTEXITCODE) { throw 'PDF-Abhängigkeit konnte nicht installiert werden.' }
          python build/create-complete-manual.py
          if ($LASTEXITCODE) { throw 'PDF-Erstellung fehlgeschlagen.' }
          python build/create-wiki.py --repository $env:GITHUB_REPOSITORY --ref $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Wiki-Erstellung fehlgeschlagen.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dokumentation
          path: |
            output/pdf/*.pdf
            artifacts/wiki/*
          if-no-files-found: error
          retention-days: 30
      - name: Wiki synchronisieren
        shell: pwsh
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          WIKI_SSH_KEY: ${{ secrets.WIKI_SSH_KEY }}
        run: ./build/sync-wiki.ps1
