name: Dokumentation und Wiki
on:
  push:
    branches: [main]
    paths: ['docs/**', 'build/create-*.py', 'build/sync-wiki.ps1', '.github/workflows/documentation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-main
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: PDF und Wiki-Seiten erzeugen
        shell: pwsh
        run: |
          python -m pip install reportlab==4.4.9
          if ($LASTEXITCODE) { throw 'PDF-Abhängigkeit konnte nicht installiert werden.' }
          python build/create-complete-manual.py
          if ($LASTEXITCODE) { throw 'PDF-Erstellung fehlgeschlagen.' }
          python build/create-wiki.py --repository $env:GITHUB_REPOSITORY --ref $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Wiki-Erstellung fehlgeschlagen.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dokumentation
          path: |
            output/pdf/*.pdf
            artifacts/wiki/*
          if-no-files-found: error
          retention-days: 30
      - name: Wiki synchronisieren
        shell: pwsh
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          WIKI_SSH_KEY: ${{ secrets.WIKI_SSH_KEY }}
        run: ./build/sync-wiki.ps1
