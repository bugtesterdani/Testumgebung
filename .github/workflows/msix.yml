name: MSIX-Build und Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: 'Basisversion X.Y.Z (leer = aktuelle Version aus dem Release-Issue)'
        required: false
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      base: ${{ steps.release.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release-Abschluss prüfen und Tag setzen
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ github.sha }}
        run: python build/github-release.py trigger --sha "$MERGED_SHA"
  build:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result == 'success' || needs.plan.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Version bestimmen
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ needs.plan.outputs.base || inputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          FALLBACK_VERSION: ${{ vars.RELEASE_VERSION || '1.0.14' }}
        run: |
          python build/github-release.py plan --base "$env:REQUESTED_VERSION" --tag "$env:RELEASE_TAG" --fallback "$env:FALLBACK_VERSION"
          if ($LASTEXITCODE) { throw 'Version konnte nicht bestimmt werden.' }
      - name: Release-Automation prüfen
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ReleaseAutomation -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Release-Automation fehlerhaft.' }
      - name: Git-Historie auf ausgewählte Geheimnismuster prüfen
        shell: pwsh
        run: |
          python build/check-publication.py
          if ($LASTEXITCODE) { throw 'Veröffentlichungsprüfung meldet möglicherweise geheime Dateien oder Tokens.' }
      - name: Toolchains und PDF bereitstellen
        shell: pwsh
        run: |
          ./build/acquire-toolchain.ps1
          ./build/acquire-python.ps1
          python -m pip install reportlab==4.4.9 pefile==2024.8.26
          if ($LASTEXITCODE) { throw 'PDF-Abhängigkeit fehlt.' }
          python build/create-complete-manual.py
          if ($LASTEXITCODE) { throw 'PDF-Erstellung fehlgeschlagen.' }
      - name: API-Dokumentation und Dokumentationsstatus erstellen
        shell: pwsh
        run: |
          python -m unittest discover -s build/tests -p test_documentation_summary.py
          if ($LASTEXITCODE) { throw 'Dokumentationsauswertung: Tests fehlgeschlagen.' }
          ./build/doxygen.ps1 -OutputDirectory artifacts/doxygen/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: API-Dokumentation-${{ steps.version.outputs.version }}
          path: artifacts/doxygen/ci/**
          if-no-files-found: warn
          retention-days: 14
      - name: Testabdeckung und CRAP-Grenze prüfen
        shell: pwsh
        run: |
          ./build/tests/verify-coverage-goals.ps1
          ./build/coverage.ps1 -EnforceTargets -RunDirectory artifacts/coverage/ci
      - name: Aufgelöste Pakete auf bekannte Sicherheitslücken prüfen
        shell: pwsh
        run: ./build/check-security.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Sicherheitspruefung-${{ steps.version.outputs.version }}
          path: artifacts/security/**
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Qualitaetsbericht-${{ steps.version.outputs.version }}
          path: artifacts/coverage/ci/**
          if-no-files-found: warn
          retention-days: 14
      - name: Signiertes MSIX-Bundle bauen
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ (github.event_name != 'pull_request' || needs.plan.outputs.tag != '') && secrets.SIGNING_PFX_BASE64 || '' }}
          TESTUMGEBUNG_SIGN_PASSWORD: ${{ (github.event_name != 'pull_request' || needs.plan.outputs.tag != '') && secrets.SIGNING_PFX_PASSWORD || '' }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          PR_BUILD: ${{ github.event_name == 'pull_request' && needs.plan.outputs.tag == '' }}
        run: |
          if ($env:PR_BUILD -ne 'true' -and -not $env:SIGNING_PFX_BASE64) { throw 'SIGNING_PFX_BASE64 fehlt. Kein neues Zufallszertifikat für CI verwenden; siehe docs/github.md.' }
          $pfx=Join-Path $env:RUNNER_TEMP ('signing-'+[guid]::NewGuid().ToString('N')+'.pfx')
          try {
            $signOptions=@{}
            if ($env:PR_BUILD -ne 'true') {
              [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
              $signOptions.CertificatePath=$pfx
            }
            ./build/msix.ps1 -Version $env:BUILD_VERSION @signOptions -PrepareOnly -SkipTests
            # Preserve the globally unique run identity without exceeding MSIX's uint16 revision.
            @{
              version=$env:BUILD_VERSION; run_number=$env:GITHUB_RUN_NUMBER
              run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT
              commit=$env:GITHUB_SHA; repository=$env:GITHUB_REPOSITORY
              run_url="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            } | ConvertTo-Json | Set-Content "artifacts/msix/$env:BUILD_VERSION/BUILD-INFO.json" -Encoding utf8
            $testResults="artifacts/msix/$env:BUILD_VERSION/tests"
            New-Item -ItemType Directory -Path $testResults -Force | Out-Null
            Get-ChildItem artifacts/coverage/ci/raw -Filter '*.trx' -Recurse | Copy-Item -Destination $testResults
            $bundle="artifacts/msix/$env:BUILD_VERSION/Testumgebung_$($env:BUILD_VERSION)_x64.msixbundle"
            python build/audit-dependencies.py --layout artifacts/publish/Testumgebung --bundle $bundle
            if ($LASTEXITCODE) { throw 'Lizenzinventar fehlgeschlagen.' }
            python build/enrich-license-inventory.py
            if ($LASTEXITCODE) { throw 'Lizenzzuordnung fehlgeschlagen.' }
            python build/create-complete-manual.py
            if ($LASTEXITCODE) { throw 'Aktualisiertes Handbuch fehlgeschlagen.' }
            ./build/update-license-layout.ps1
            ./build/msix.ps1 -Version $env:BUILD_VERSION @signOptions -UsePreparedLayout
            python build/verify-release-inventory.py --bundle $bundle
            if ($LASTEXITCODE) { throw 'Nachprüfung des signierten Pakets fehlgeschlagen.' }
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: MSIX-${{ steps.version.outputs.version }}
          path: |
            artifacts/msix/${{ steps.version.outputs.version }}/LICENSE
            artifacts/msix/${{ steps.version.outputs.version }}/*.msixbundle
            artifacts/msix/${{ steps.version.outputs.version }}/*.cer
            artifacts/msix/${{ steps.version.outputs.version }}/*.txt
            artifacts/msix/${{ steps.version.outputs.version }}/*.zip
            artifacts/msix/${{ steps.version.outputs.version }}/*.json
            artifacts/msix/${{ steps.version.outputs.version }}/*.md
            artifacts/msix/${{ steps.version.outputs.version }}/tests/**
            output/pdf/*.pdf
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
  release:
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.tag != '' }}
    needs: [plan, build]
    runs-on: windows-latest
    concurrency:
      group: release-publication-and-next-planning
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build-Artefakt herunterladen und Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "MSIX-$env:RELEASE_VERSION" --dir release
          if ($LASTEXITCODE) { throw 'Release-Artefakt konnte nicht heruntergeladen werden.' }
          $assets=Get-ChildItem release -Recurse -File | Where-Object { $_.Extension -in '.msixbundle','.cer','.pdf','.zip' -or $_.Name -in 'SHA256SUMS.txt','INSTALLATION.md','LICENSE-VERIFICATION.json','BUILD-INFO.json','PUBLICATION.md','LICENSE','THIRD-PARTY-TERMS.md','THIRD-PARTY-NOTICES.md' }
          if (-not ($assets | Where-Object Extension -EQ '.msixbundle')) { throw 'MSIX-Bundle fehlt.' }
          $existingJson=gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json databaseId,isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing=$existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) { throw 'Ein veröffentlichtes Release darf nicht überschrieben werden.' }
            gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --clobber @($assets.FullName)
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Testumgebung $env:RELEASE_VERSION" @($assets.FullName)
          }
          if ($LASTEXITCODE) { throw 'Release-Erstellung fehlgeschlagen.' }
          python build/github-release.py publish --tag $env:RELEASE_TAG --package-version $env:RELEASE_VERSION
          if ($LASTEXITCODE) { throw 'Release Notes konnten nicht vollständig erstellt werden. Release bleibt Entwurf.' }
      - name: Nächstes bearbeitbares Release-Issue vorbereiten
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python build/github-release.py next --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'Release gebaut; nächste Versionsplanung konnte nicht angelegt werden.' }
