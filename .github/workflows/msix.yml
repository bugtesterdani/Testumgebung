name: MSIX-Build und Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'MSIX-Version (vier Zahlen, z.B. 1.0.13.0; leer = automatischer Entwicklungsstand)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Version bestimmen
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version=$env:GITHUB_REF_NAME.TrimStart('v') }
          if (-not $version) { $version="1.0.13.$env:GITHUB_RUN_NUMBER" }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Version muss vier Zahlen enthalten.' }
          $v=[version]$version
          if (@($v.Major,$v.Minor,$v.Build,$v.Revision | Where-Object { $_ -gt 65535 }).Count) { throw 'MSIX-Version überschreitet 65535.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Toolchains und PDF bereitstellen
        shell: pwsh
        run: |
          ./build/acquire-toolchain.ps1
          ./build/acquire-python.ps1
          python -m pip install reportlab==4.4.9 pefile==2024.8.26
          if ($LASTEXITCODE) { throw 'PDF-Abhängigkeit fehlt.' }
          python build/create-complete-manual.py
          if ($LASTEXITCODE) { throw 'PDF-Erstellung fehlgeschlagen.' }
      - name: Signiertes MSIX-Bundle bauen und testen
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          TESTUMGEBUNG_SIGN_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) { throw 'SIGNING_PFX_BASE64 fehlt. Kein neues Zufallszertifikat für CI verwenden; siehe docs/github.md.' }
          $pfx=Join-Path $env:RUNNER_TEMP ('signing-'+[guid]::NewGuid().ToString('N')+'.pfx')
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            ./build/msix.ps1 -Version $env:BUILD_VERSION -CertificatePath $pfx -PrepareOnly
            $bundle="artifacts/msix/$env:BUILD_VERSION/Testumgebung_$($env:BUILD_VERSION)_x64.msixbundle"
            python build/audit-dependencies.py --layout artifacts/publish/Testumgebung --bundle $bundle
            if ($LASTEXITCODE) { throw 'Lizenzinventar fehlgeschlagen.' }
            python build/enrich-license-inventory.py
            if ($LASTEXITCODE) { throw 'Lizenzzuordnung fehlgeschlagen.' }
            python build/create-complete-manual.py
            if ($LASTEXITCODE) { throw 'Aktualisiertes Handbuch fehlgeschlagen.' }
            ./build/update-license-layout.ps1
            ./build/msix.ps1 -Version $env:BUILD_VERSION -CertificatePath $pfx -UsePreparedLayout
            python build/verify-release-inventory.py --bundle $bundle
            if ($LASTEXITCODE) { throw 'Nachprüfung des signierten Pakets fehlgeschlagen.' }
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: MSIX-${{ steps.version.outputs.version }}
          path: |
            artifacts/msix/${{ steps.version.outputs.version }}/*.msixbundle
            artifacts/msix/${{ steps.version.outputs.version }}/*.cer
            artifacts/msix/${{ steps.version.outputs.version }}/*.txt
            artifacts/msix/${{ steps.version.outputs.version }}/*.json
            artifacts/msix/${{ steps.version.outputs.version }}/*.md
            artifacts/msix/${{ steps.version.outputs.version }}/tests/**
            output/pdf/*.pdf
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Build-Artefakt herunterladen und Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "MSIX-$env:RELEASE_VERSION" --dir release
          if ($LASTEXITCODE) { throw 'Release-Artefakt konnte nicht heruntergeladen werden.' }
          $assets=Get-ChildItem release -Recurse -File | Where-Object { $_.Extension -in '.msixbundle','.cer','.pdf' -or $_.Name -in 'SHA256SUMS.txt','INSTALLATION.md' }
          if (-not ($assets | Where-Object Extension -EQ '.msixbundle')) { throw 'MSIX-Bundle fehlt.' }
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "Testumgebung $env:RELEASE_VERSION" --generate-notes @($assets.FullName)
          if ($LASTEXITCODE) { throw 'Release-Erstellung fehlgeschlagen.' }
