name: Release-Issue nach Merge
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: read
concurrency:
  group: release-issue-main
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      base: ${{ steps.release.outputs.base }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release-Abschluss prüfen und Tag setzen
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ github.sha }}
        run: python build/github-release.py trigger --sha "$MERGED_SHA"
  package:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/msix.yml
    with:
      release_tag: ${{ needs.plan.outputs.tag }}
      base_version: ${{ needs.plan.outputs.base }}
      target_sha: ${{ needs.plan.outputs.sha }}
    secrets: inherit
