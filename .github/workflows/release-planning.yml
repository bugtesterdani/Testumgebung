name: Bearbeitbare Release-Version synchronisieren
on:
  issues:
    types: [opened, edited, labeled, reopened]
permissions:
  contents: read
  issues: write
concurrency:
  group: release-planning
  cancel-in-progress: false
jobs:
  sync:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Versions-Milestone zuordnen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ISSUE: ${{ github.event.issue.number }}
        run: python build/github-release.py sync --issue "$RELEASE_ISSUE"
