name: Bearbeitbare Release-Version synchronisieren
on:
  issues:
    types: [opened, edited, labeled, reopened]
permissions:
  contents: read
  issues: write
concurrency:
  group: release-planning
  cancel-in-progress: false
jobs:
  sync:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Versions-Milestone zuordnen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ISSUE: ${{ github.event.issue.number }}
        run: python build/github-release.py sync --issue "$RELEASE_ISSUE"
